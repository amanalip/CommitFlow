<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" fill="none">
  <defs>
    <linearGradient id="brandTrunk" x1="8" y1="44" x2="56" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="brandBranch" x1="22" y1="44" x2="54" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="textGrad" x1="72" y1="36" x2="220" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <!-- Graphic Mark -->
  <g transform="translate(4, 0)">
    <!-- Main Trunk -->
    <path d="M 8 44 L 56 44" stroke="url(#brandTrunk)" stroke-width="4" stroke-linecap="round" />
    <!-- Branch Flow -->
    <path d="M 22 44 C 22 28, 30 20, 38 20 L 44 20 C 50 20, 54 32, 54 44" stroke="url(#brandBranch)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Arrow -->
    <path d="M 53 40 L 58 44 L 53 48" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Commit Nodes -->
    <circle cx="10" cy="44" r="4.5" fill="#0284c7" stroke="#ffffff" stroke-width="2" />
    <circle cx="22" cy="44" r="4.5" fill="#0369a1" stroke="#38bdf8" stroke-width="2" />
    <circle cx="38" cy="20" r="4.5" fill="#9333ea" stroke="#ffffff" stroke-width="2" />
    <circle cx="46" cy="20" r="4" fill="#ec4899" stroke="#ffffff" stroke-width="2" />
    <circle cx="54" cy="44" r="5" fill="#0284c7" stroke="#38bdf8" stroke-width="2.5" />
  </g>

  <!-- Typography -->
  <text x="76" y="38" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="currentColor" letter-spacing="-0.5">Commit<tspan fill="#38bdf8">Flow</tspan></text>
  <text x="77" y="52" font-family="'Fira Code', monospace" font-size="9" font-weight="500" fill="#94a3b8" letter-spacing="1">WATCH COMMITS FLOW</text>
</svg>
